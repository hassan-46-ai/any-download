name: youtube_downloader
description: "Save videos and audio from YouTube, Facebook, Instagram, TikTok, X and more."
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  youtube_explode_dart: ^3.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#7C4DFF"
  color_dark: "#7C4DFF"
  android_12:
    color: "#7C4DFF"
